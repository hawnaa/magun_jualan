<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang - Gunadarma Shop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/buyer.css">
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🎓 Gunadarma Shop</h2>
            <p class="user-role">Buyer</p>
        </div>
        <nav class="sidebar-menu">
            <a href="dashboard.html" class="menu-item">
                <span class="icon">🏠</span>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="menu-item">
                <span class="icon">🛍️</span>
                <span>Cari Produk</span>
            </a>
            <a href="cart.html" class="menu-item active">
                <span class="icon">🛒</span>
                <span>Keranjang</span>
                <span class="badge" id="cartBadge">0</span>
            </a>
            <a href="profile.html" class="menu-item">
                <span class="icon">👤</span>
                <span>Profil</span>
            </a>
            <a href="#" class="menu-item" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="dashboard-header">
            <h1>Keranjang Belanja</h1>
            <div class="header-user">
                <span id="userName">Loading...</span>
                <div class="user-avatar">👤</div>
            </div>
        </header>

        <!-- Cart Content -->
        <section class="cart-section">
            <div class="cart-container">
                <!-- Cart Items -->
                <div class="cart-items" id="cartItems">
                    <div class="loading">Memuat keranjang...</div>
                </div>

                <!-- Cart Summary -->
                <div class="cart-summary">
                    <h3>Ringkasan Belanja</h3>
                    <div class="summary-row">
                        <span>Total Item:</span>
                        <span id="totalItems">0</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total Harga:</span>
                        <span id="totalPrice">Rp 0</span>
                    </div>
                    <button class="btn-checkout" onclick="checkout()">
                        💬 Checkout via WhatsApp
                    </button>
                    <p class="checkout-note">
                        *Anda akan dihubungkan dengan seller via WhatsApp untuk proses pembayaran
                    </p>
                </div>
            </div>
        </section>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Custom Scripts -->
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/buyer.js"></script>
</body>
</html>
